<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>干嘛.....</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        :root {
            --primary: #6200EE;
            --primary-light: #BB86FC;
            --bg-dark: #121212;
            --card-dark: #1E1E1E;
            --text-primary: #FFFFFF;
            --text-secondary: #BBBBBB;
            --border-radius: 12px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            color: var(--text-primary);
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-dark);
            border-radius: var(--border-radius);
            padding: 3rem;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: var(--transition);
        }

        .container:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header h1 {
            font-size: 1.8rem;
            background: linear-gradient(90deg, var(--primary-light), var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: var(--border-radius);
            padding: 3rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 2rem;
            position: relative;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background-color: rgba(98, 0, 238, 0.05);
        }

        #fileInput {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--primary-light);
        }

        .upload-text h3 {
            font-size: 1.1rem;
            margin-bottom: 0.3rem;
        }

        .upload-text p {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .convert-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            border: none;
            border-radius: var(--border-radius);
            color: white;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(98, 0, 238, 0.4);
        }

        .convert-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(98, 0, 238, 0.6);
        }

        .convert-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #status {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-secondary);
            min-height: 1.2rem;
        }

        .footer {
            margin-top: 2.5rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>干嘛....</h1>
            <p>干嘛....</p>
        </div>

        <div class="upload-area">
            <input type="file" id="fileInput" accept=".zip">
            <div class="upload-icon">🥵</div>
            <div class="upload-text">
                <h3>点</h3>
                <p>支持 ZIP 格式 · 转换后为 .mcpack 文件</p>
            </div>
        </div>

        <button class="convert-btn" id="convertBtn">开始转换</button>
        <div id="status"></div>

        <div class="footer">
            <p>fvv</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script>
        const fileInput = document.getElementById('fileInput');
        const convertBtn = document.getElementById('convertBtn');
        const status = document.getElementById('status');
        let selectedFile = null;

        // 监听文件选择
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                status.textContent = `已选择：${selectedFile.name}`;
                convertBtn.disabled = false;
            } else {
                selectedFile = null;
                status.textContent = "";
                convertBtn.disabled = true;
            }
        });

        // 生成基岩版manifest.json
        function createManifest() {
            return {
                format_version: 2,
                header: {
                    name: "Converted Texture Pack",
                    description: "Converted from Java Edition",
                    uuid: self.crypto.randomUUID(),
                    version: [1, 0, 0],
                    min_engine_version: [1, 19, 0]
                },
                modules: [{
                    type: "resources",
                    uuid: self.crypto.randomUUID(),
                    version: [1, 0, 0]
                }]
            };
        }

        // 转换逻辑
        convertBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            const jszip = new JSZip();
            status.textContent = "正在解析材质包...";
            convertBtn.disabled = true;

            try {
                const zip = await jszip.loadAsync(selectedFile);
                const newZip = new JSZip();

                // 过滤文件并添加到新压缩包
                for (const [path, fileObj] of Object.entries(zip.files)) {
                    if (fileObj.dir || path.endsWith('.mcmeta')) continue;
                    const content = await fileObj.async('arraybuffer');
                    newZip.file(path, content);
                }

                // 添加manifest文件
                const manifest = createManifest();
                newZip.file('manifest.json', JSON.stringify(manifest, null, 2));

                status.textContent = "正在生成 .mcpack 文件...";
                // 打包下载
                const mcpackBlob = await newZip.generateAsync({ 
                    type: 'blob', 
                    compression: 'DEFLATE',
                    compressionOptions: { level: 6 }
                });

                const url = URL.createObjectURL(mcpackBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `MC_Converted_${Date.now()}.mcpack`;
                a.click();

                URL.revokeObjectURL(url);
                status.textContent = "✅ 转换完成！文件已自动下载";
                selectedFile = null;
                fileInput.value = "";

            } catch (err) {
                status.textContent = `❌ 转换失败：${err.message}`;
                console.error(err);
                convertBtn.disabled = false;
            }
        });

        // 初始禁用按钮
        convertBtn.disabled = true;
    </script>
</body>
</html>
